<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi editor — Locablo</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 24px; color: #222; }
  main { max-width: 560px; margin: 0 auto; }
  ul { padding-left: 20px; }
  button { padding: 10px 16px; font-size: 15px; border: 1px solid #999; border-radius: 8px; background: #fff; }
  .aviso { padding: 12px; background: #fff4cc; border-radius: 8px; }
</style>
</head>
<body>
<main>
  <h1 id="titulo">Mi editor</h1>
  <p id="direccion"></p>
  <h2>Mis piezas</h2>
  <ul id="piezas"></ul>
  <p class="aviso">Agregar, mover y recolorear piezas con la mano es el siguiente paso (viernes/sábado). Por ahora aquí ves tu negocio y sus piezas.</p>
  <p><a id="ver" href="#">Ver mi página</a> · <button id="salir" type="button">Salir</button></p>
</main>
<script>
  // Pide el negocio del dueño que entró. Sin sesión, vuelve a la página principal.
  fetch("/api/mi-negocio")
    .then((r) => { if (!r.ok) throw new Error("sin sesión"); return r.json(); })
    .then((dato) => {
      document.getElementById("titulo").textContent = "Editor de " + dato.negocio.name;
      document.getElementById("direccion").textContent = dato.negocio.subdomain + ".locablo.com";
      // En la computadora, la página se ve en <subdominio>.localhost;
      // en internet, en <subdominio>.locablo.com.
      const esLocal = location.hostname === "localhost" || location.hostname.endsWith(".localhost");
      document.getElementById("ver").href = esLocal
        ? "http://" + dato.negocio.subdomain + ".localhost:" + location.port
        : "https://" + dato.negocio.subdomain + ".locablo.com";
      const lista = document.getElementById("piezas");
      if (!dato.piezas.length) {
        lista.innerHTML = "<li>Todavía no tienes piezas. Se agregan en el siguiente paso.</li>";
      } else {
        dato.piezas.forEach((p) => {
          const li = document.createElement("li");
          let datos = {};
          try { datos = JSON.parse(p.content); } catch (e) {}
          li.textContent = p.type + ": " + (datos.texto || datos.url || "");
          lista.appendChild(li);
        });
      }
    })
    .catch(() => { window.location.href = "/"; });

  document.getElementById("salir").addEventListener("click", async () => {
    await fetch("/api/salir", { method: "POST" });
    window.location.href = "/";
  });
</script>
</body>
</html>
